<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rover · 대회 임무 관찰</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e6eef7}*{box-sizing:border-box}body{max-width:1600px;margin:auto;padding:22px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0}p{color:#a6b9ce}#connection{padding:8px 14px;border-radius:20px;background:#27384e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:#142035;border:1px solid #293d56;border-radius:12px;padding:16px}h2{font-size:17px;margin:0 0 12px}img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#080e18;border-radius:6px}canvas{width:100%;aspect-ratio:5/4;background:#080e18}#details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#0c1728;padding:12px;border-radius:8px}.metric small{display:block;color:#9bb0c6}.metric strong{font-size:19px}.visits{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.visit{padding:8px;border-radius:6px;background:#22314a}.reached{background:#145c4b}.failed{background:#783a3a}.active{background:#69501d}select{padding:6px;background:#263952;border:1px solid #49637f;color:white;border-radius:5px}.legend{font-size:13px;color:#adc0d1;margin-top:8px;line-height:1.8}code{word-break:break-all;font-size:12px}.wide{grid-column:1/-1}#notice{color:#f9c26f}#error{color:#ff9c9c}@media(max-width:1000px){.grid{grid-template-columns:1fr}#details{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1000px){body{padding:12px}h1{font-size:20px}#details{grid-template-columns:repeat(4,1fr);gap:5px}.metric{padding:7px}.metric strong{font-size:13px}.metric small{font-size:10px}.panel{padding:10px}.grid{gap:10px}.visits{margin:8px 0}.visit{font-size:12px;padding:5px}.grid>section:nth-child(3){order:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid>section:nth-child(3)>h2{font-size:13px;margin:0!important}.grid>section:nth-child(3)>h2:nth-of-type(1){grid-column:1;grid-row:1}.grid>section:nth-child(3)>h2:nth-of-type(2){grid-column:2;grid-row:1}.grid>section:nth-child(3)>img:nth-of-type(1){grid-column:1;grid-row:2}.grid>section:nth-child(3)>img:nth-of-type(2){grid-column:2;grid-row:2}.grid>section:nth-child(2){order:2}.legend{font-size:11px;line-height:1.5}}
</style>
<header><h1>Rover · 대회 임무 관찰</h1><span id="connection">서버 준비 중</span></header>
<p>Isaac 물리 시뮬레이션 · 정답 pose feedback · 고정 모래 표면</p>
<div id="notice">자연 주행과 정체 주입 시험은 별도로 기록합니다.</div>
<div class="grid">
<section class="panel wide"><div id="details"></div><div id="visits" class="visits"></div><div id="error"></div><code id="recording"></code></section>
<section class="panel"><h2>계획 경로 · 실제 궤적 · costmap <select id="layer"><option value="auto">현재 경로 기준</option value="normal_cost">일반 경사 기준</option value="trial_cost">30° 시험 기준</option><option value="experience">방문 경험</option></select></h2><canvas id="map" width="1000" height="800"></canvas><div class="legend">파랑 30° · 주황 15° · 초록 10° · 청록 실제 궤적 · 흰 화살표 현재 pose<br>지형 cost: 초록 낮음 → 노랑 → 빨강 높음 · 검정 차단(254) · 회색 미관측(255)<br>방문 경험: 주행 관측 횟수만 표시하며 미방문 영역은 채우지 않습니다.</div></section>
<section class="panel"><h2>경기장 전체 <small id="overviewAge"></small></h2><img id="overview" alt="경기장 영상 준비 중"><h2 style="margin-top:16px">전방 카메라 <small id="frontAge"></small></h2><img id="front" alt="전방 영상 준비 중"></section>
</div>
<script>
let mapData=null,state=null;const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const names={to_junction:'갈림길 이동',trial_entry:'30° 진입점 이동',ascending:'등판',retreating:'실제 경로 후퇴',descending:'10° 하산',returning:'출발지 복귀',complete:'임무 완료',failed:'임무 실패'};
const labels={entry30:'30° 진입점',entry15:'15° 진입점',entry10:'10° 진입점',summit:'정상',return:'복귀'};
function text(id,value){document.getElementById(id).textContent=value}
function draw(){if(!mapData)return;const costs=mapData.normal_cost,rows=costs.length,cols=costs[0].length,r=mapData.resolution,ox=mapData.origin[0],oy=mapData.origin[1];
const scale=Math.min((canvas.width-100)/cols,(canvas.height-90)/rows),left=(canvas.width-cols*scale)/2,top=(canvas.height-rows*scale)/2;
const xy=p=>[left+(p[0]-ox)/r*scale,top+(rows-(p[1]-oy)/r)*scale];ctx.clearRect(0,0,canvas.width,canvas.height);
let selected=document.getElementById('layer').value;const m=state?.last?.mission||{};if(selected==='auto')selected=(m.route==='30'&&['ascending','trial_entry','retreating'].includes(m.state))?'trial_cost':'normal_cost';
const layer=mapData[selected]||costs;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let v=layer[y][x];let color=v===255?'#637084':v===254?'#060b12':`hsl(${120-120*v/252} 62% ${28+12*v/252}%)`;if(selected==='experience')color='#17243a';ctx.fillStyle=color;ctx.fillRect(left+x*scale,top+(rows-1-y)*scale,scale+.2,scale+.2)}
if(selected==='experience'&&state?.experience)for(const [x,y,n] of state.experience){ctx.fillStyle=`hsl(${180-Math.min(n,80)} 85% 55%)`;ctx.fillRect(left+x*scale,top+(rows-1-y)*scale,scale+.3,scale+.3)}
const line=(p,color,width)=>{if(!p?.length)return;ctx.beginPath();p.forEach((pt,i)=>{const q=xy(pt);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()};
for(const [key,color] of [['30','#61a4ff'],['15','#ffa75c'],['10','#6cdb8c']])line(mapData.routes[key],color,3);
line(state?.trajectory,'#51efff',3);ctx.font='16px system-ui';for(const [name,p] of [['START',mapData.start],['JUNCTION',mapData.junction],['SUMMIT',mapData.summit]]){const q=xy(p);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(...q,5,0,7);ctx.fill();ctx.fillText(name,q[0]+7,q[1]-8)}
const last=state?.last;if(last?.position_m){const q=xy(last.position_m),w=last.quaternion_wxyz;const yaw=w?Math.atan2(2*(w[0]*w[3]+w[1]*w[2]),1-2*(w[2]**2+w[3]**2)):0;ctx.save();ctx.translate(...q);ctx.rotate(-yaw);ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-9);ctx.lineTo(-5,0);ctx.lineTo(-10,9);ctx.closePath();ctx.fillStyle='white';ctx.fill();ctx.restore()}
ctx.fillStyle='#c6d5e4';ctx.fillText('X (m) →',canvas.width-95,canvas.height-12);ctx.fillText('Y (m) ↑',10,20);ctx.fillText(`${ox.toFixed(2)}, ${oy.toFixed(2)}`,left,top+rows*scale+23)}
function update(){const l=state.last||{},m=l.mission||{};text('connection',state.stale?'상태 수신 지연':state.status==='running'?'서버 실행 중':state.status);document.getElementById('connection').style.background=state.stale?'#833f32':'#1a574d';
text('notice',l.fault_injection?'정체 주입 시험 · 30°에서 wheel target을 제한해 후퇴·우회를 검사합니다.':'자연 주행 · 등판 성공과 실패를 실제 시뮬레이션 결과대로 기록합니다.');
const metrics=[['현재 단계',names[m.state]||'초기화'],['경로 / 방향',`${m.route||'—'}° / ${m.direction||'—'}`],['simulation 시간',`${(l.stamp_s||0).toFixed(1)} s`],['wall 시간',`${(l.wall_s||0).toFixed(1)} s`],['위치 (m)',l.position_m?.slice(0,2).map(x=>x.toFixed(3)).join(', ')||'—'],['관측 방문 칸',state.visited_cells||0],['costmap 저장',state.snapshot_count||0],['상태 age',`${state.age_s.toFixed(1)} s`]];
const d=document.getElementById('details');d.replaceChildren(...metrics.map(([k,v])=>{const e=document.createElement('div');e.className='metric';const a=document.createElement('small'),b=document.createElement('strong');a.textContent=k;b.textContent=v;e.append(a,b);return e}));
const visits=document.getElementById('visits');visits.replaceChildren(...Object.entries(m.visits||{}).map(([k,v])=>{const e=document.createElement('span');e.className='visit '+v;e.textContent=(labels[k]||k)+': '+v;return e}));text('recording',state.recording||'');text('error',[state.reason,m.reason,m.camera_error].filter(x=>x&&x!=='active').join(' · '));
for(const key of ['overview','front']){const age=state.image_age_s?.[key];text(key+'Age',age==null?'영상 준비 중':`(${age.toFixed(1)}초 전)`);document.getElementById(key).src='/frame/'+key+'.jpg?t='+Date.now()}draw()}
async function poll(){try{if(!mapData){const r=await fetch('/map',{cache:'no-store'});if(r.ok)mapData=await r.json()}const r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error('장면·기록 준비 중');state=await r.json();update()}catch(e){text('connection',e.message);document.getElementById('connection').style.background='#7a4936'}finally{setTimeout(poll,400)}}
document.getElementById('layer').addEventListener('change',draw);poll();
</script></html>
